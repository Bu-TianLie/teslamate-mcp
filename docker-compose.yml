services:
  teslamate-mcp:
    build:
      context: .
    image: teslamate-mcp:local
    container_name: teslamate-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      MCP_HOST: 0.0.0.0
      MCP_PORT: ${MCP_PORT:-8000}
      LOCAL_TIMEZONE: ${LOCAL_TIMEZONE:-Asia/Shanghai}
    ports:
      - "${MCP_PORT:-8000}:${MCP_PORT:-8000}"
    networks:
      - teslamate
    healthcheck:
      test: ["CMD", "teslamate-mcp", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  teslamate:
    name: ${TESLAMATE_DOCKER_NETWORK:-teslamate_default}
    external: true
